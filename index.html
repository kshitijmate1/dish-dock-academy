<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISH Dock Academy - LPN Receiving Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --ink:#f1f5f9; --muted:#94a3b8;
    --accent:#2dd4bf; --accent-ink:#042f2e; --green:#34d399; --red:#fb7185; --blue:#60a5fa;
    --crit:#7c3aed; --nec:#0284c7; --basic:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%,#1e3a5f 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#134e4a 0%,transparent 55%),var(--bg);color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:rgba(15,23,42,.75);backdrop-filter:blur(8px);border-bottom:1px solid #1f2b40}
  header h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:800}
  header h1 span{color:var(--accent)}
  .hud{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--panel2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
  main{max-width:820px;margin:0 auto;padding:22px}
  .screen{display:none}
  .screen.active{display:block}
  .panel{background:rgba(30,41,59,.85);border:1px solid #2b3a52;border-radius:20px;padding:26px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
  h2{margin-top:0}
  .muted{color:var(--muted)}
  .btn{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;color:var(--accent-ink);background:var(--accent);transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--panel2)}
  .btn.blue{background:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--panel2);background:#0f172a;color:var(--ink);font-size:16px;margin-top:4px}
  input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
  .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .rule{background:#0f172a;border:1px solid #2b3a52;border-radius:14px;padding:14px;text-align:center}
  .rule b{display:block;font-size:28px;color:var(--accent)}
  .tier{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.2px;padding:4px 10px;border-radius:999px;color:#fff}
  .tier.critical{background:var(--crit)} .tier.necessary{background:var(--nec)} .tier.basic{background:var(--basic)}
  .topic{font-size:12px;font-weight:700;color:var(--muted);margin-left:8px;text-transform:uppercase;letter-spacing:1.2px}
  .face.front .topic{color:#57534e}

  /* truck progress */
  .truck{position:relative;height:54px;margin:4px 0 18px;background:var(--panel);border:1px solid #2b3a52;border-radius:14px;overflow:hidden}
  .truck .road{position:absolute;left:0;right:0;bottom:9px;height:3px;background:repeating-linear-gradient(90deg,#475569 0 18px,transparent 18px 32px)}
  .truck .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(45,212,191,.08),rgba(45,212,191,.22));transition:width .4s}
  .truck .rig{position:absolute;top:6px;font-size:32px;transition:left .4s;transform:scaleX(-1)}
  .truck .dock{position:absolute;right:12px;top:15px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--accent)}

  /* flashcard = shipping label */
  .scene{perspective:1200px;margin:6px 0 18px}
  .card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .55s}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:30px 28px 26px;display:flex;flex-direction:column;justify-content:center;
    background:#fef9e1;color:#0f172a;box-shadow:0 18px 36px rgba(0,0,0,.35);overflow:hidden}
  .face.front:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--band,#2dd4bf)}
  .face .label{position:absolute;top:22px;right:22px;border:1px solid #e5d9a8;border-radius:6px;padding:3px 8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:#475569;background:#fffdf3}
  .face .q{font-size:23px;font-weight:750;line-height:1.35;position:relative}
  .card.critical{--band:var(--crit)} .card.necessary{--band:var(--nec)} .card.basic{--band:var(--basic)}
  .face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#1e293b,#0f172a);color:var(--ink);border:1px solid #2b3a52}
  .verdict{font-size:28px;font-weight:900;margin-bottom:10px}
  .verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
  .why{font-size:18px;line-height:1.55}
  .answer{font-weight:800;color:var(--accent)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .choice{font-size:20px;padding:20px;border-radius:16px}
  .choice.right{background:#10b981;color:#fff} .choice.wrong{background:#f43f5e;color:#fff}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}

  .bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .bar > i{display:block;height:100%}
  .big{font-size:56px;font-weight:900;margin:6px 0}
  .pass{color:var(--green)} .fail{color:var(--red)}
  table{width:100%;border-collapse:collapse;margin:10px 0}
  td,th{padding:10px;border-bottom:1px solid #2b3a52;text-align:left;font-size:15px}
  .miss{background:#0f172a;border:1px solid #2b3a52;border-radius:12px;padding:12px 14px;margin:10px 0}
  .miss b{color:var(--accent)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{border:1px solid var(--panel2);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
  .filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .cert{display:none}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media (max-width:640px){ .rules{grid-template-columns:1fr} .face .q{font-size:20px} header h1{font-size:15px} }
  @media print{
    body{background:#fff;color:#000} header,main,footer,#confetti{display:none!important}
    .cert{display:block!important;text-align:center;padding:60px;border:10px double #0f766e;margin:30px;font-family:Georgia,serif}
    .cert h1{font-size:40px;margin:0 0 10px} .cert .nm{font-size:34px;font-weight:bold;margin:20px 0;border-bottom:2px solid #000;display:inline-block;padding:0 30px}
  }

  .primer{background:#0f172a;border:1px solid #2b3a52;border-radius:16px;padding:6px 16px;margin:0 0 16px}
  .primer summary{cursor:pointer;font-weight:800;font-size:17px;padding:10px 0;list-style:none}
  .primer summary::-webkit-details-marker{display:none}
  .primer summary:after{content:" ▾";color:var(--accent)} .primer[open] summary:after{content:" ▴"}
  .primer ol{margin:4px 0 8px;padding-left:22px} .primer li{margin:8px 0;line-height:1.45}
  .primer li b{color:var(--accent)}
  .primer .rule{background:rgba(45,212,191,.1);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-weight:600}
  #sCard{min-height:420px}
  #sCard .face.back{justify-content:flex-start;overflow-y:auto}
  .ctx{margin-top:14px;padding-top:12px;border-top:1px solid #2b3a52;font-size:15.5px;line-height:1.5;color:#cbd5e1}
  .ctx .lbl{display:block;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin:8px 0 2px}
  .fliphint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;font-weight:700;color:#57534e;letter-spacing:.3px}
  .miss .ctx{font-size:14px;margin-top:8px;padding-top:8px}
  .lang{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:-6px 0 10px}
  .lang button{border:1px solid var(--panel2);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
  .lang button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header>
  <h1>🚚 DISH <span>Dock Academy</span> · <span data-i18n="edition" style="color:inherit">LPN Edition</span></h1>
  <div class="hud" id="hud" style="display:none">
    <div class="chip" id="hudQ"></div>
    <div class="chip" id="hudScore"></div>
    <div class="chip" id="hudStreak"></div>
  </div>
</header>

<main>
  <!-- START -->
  <section class="screen active" id="start">
    <div class="panel">
      <div class="lang" role="group" aria-label="Language">
        <span class="muted" data-i18n="langLabel">Language</span>
        <button type="button" data-lang="en" class="on">English</button>
        <button type="button" data-lang="es">Español</button>
      </div>
      <h2 data-i18n="welcome"></h2>
      <p data-i18n="intro"></p>
      <p data-i18n-html="how"></p>
      <div class="rules">
        <div class="rule"><b>25</b><span class="muted" data-i18n="ruleCards"></span></div>
        <div class="rule"><b>50</b><span class="muted" data-i18n="ruleMarks"></span></div>
        <div class="rule"><b>40</b><span class="muted" data-i18n="rulePass"></span></div>
      </div>
      <p class="muted" data-i18n="sentNote"></p>
      <div class="row">
        <div style="flex:1;min-width:200px"><label class="muted" for="first" data-i18n="first"></label><input type="text" id="first" maxlength="40" autocomplete="given-name"></div>
        <div style="flex:1;min-width:200px"><label class="muted" for="last" data-i18n="last"></label><input type="text" id="last" maxlength="40" autocomplete="family-name"></div>
      </div>
      <p id="nameErr" style="color:var(--red);font-weight:700;display:none" data-i18n="nameErr"></p>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="goQuiz" data-i18n="goQuiz"></button>
        <button class="btn ghost" id="goStudy" data-i18n="goStudy"></button>
      </div>
      <p class="muted" id="best" style="margin-top:14px"></p>
    </div>
  </section>

  <!-- STUDY -->
  <section class="screen" id="study">
    <div class="panel">
      <h2 data-i18n="studyTitle"></h2>
      <p class="muted" data-i18n="studyHint"></p>
      <details class="primer" id="primer" open><summary id="primerTitle"></summary><ol id="primerList"></ol><div class="rule" id="primerRule"></div></details>
      <div class="filters" id="filters"></div>
      <div class="scene"><div class="card" id="sCard">
        <div class="face front"><div class="label" id="sLabel"></div><div><span class="tier" id="sTier"></span><span class="topic" id="sTopic"></span></div><div class="q" id="sQ" style="margin-top:14px"></div><div class="fliphint" id="sFlip"></div></div>
        <div class="face back"><div class="verdict" id="sAns"></div><div class="why" id="sWhy"></div><div class="ctx" id="sCtx"></div></div>
      </div></div>
      <div class="row" style="justify-content:space-between;align-items:center">
        <button class="btn ghost" id="sPrev" data-i18n="prev"></button>
        <span class="chip" id="sCount"></span>
        <button class="btn ghost" id="sNext" data-i18n="next"></button>
      </div>
      <div class="row" style="justify-content:center;margin-top:10px"><span class="chip" id="sProg" style="display:none"></span></div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="studyToQuiz" data-i18n="studyToQuiz"></button>
        <button class="btn ghost" id="studyHome" data-i18n="home"></button>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="quiz">
    <div class="truck"><div class="fill" id="fill"></div><div class="road"></div><div class="rig" id="rig">🚚</div><div class="dock" data-i18n="dock"></div></div>
    <div class="scene"><div class="card" id="qCard">
      <div class="face front"><div class="label" id="qLabel"></div><div><span class="tier" id="qTier"></span><span class="topic" id="qTopic"></span></div><div class="q" id="qText" style="margin-top:14px"></div></div>
      <div class="face back"><div class="verdict" id="qVerdict"></div><div class="why"><span class="answer" id="qAnswer"></span> <span id="qWhy"></span></div></div>
    </div></div>
    <div class="choices" id="choices">
      <button class="btn choice right" id="bRight" data-i18n="right"></button>
      <button class="btn choice wrong" id="bWrong" data-i18n="wrong"></button>
    </div>
    <div class="row" id="nextRow" style="display:none;justify-content:center">
      <button class="btn blue" id="bNext" style="min-width:240px"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="results">
    <div class="panel">
      <h2 id="rTitle"></h2>
      <div class="big" id="rScore"></div>
      <div class="bar"><i id="rBar"></i></div>
      <p id="rMsg" style="font-size:18px"></p>
      <table>
        <thead><tr><th data-i18n="thSection"></th><th data-i18n="thCorrect"></th></tr></thead>
        <tbody id="rTable"></tbody>
      </table>
      <div class="row" style="margin:14px 0">
        <button class="btn" id="rRetry" data-i18n="retry"></button>
        <button class="btn ghost" id="rStudyMiss" data-i18n="studyMiss"></button>
        <button class="btn ghost" id="rCert" style="display:none" data-i18n="printCert"></button>
      </div>
      <p id="rLock" class="chip" style="display:none;margin:6px 0"></p>
      <h3 id="rMissTitle"></h3>
      <div id="rMiss"></div>
    </div>
  </section>
</main>

<div class="cert" id="cert">
  <div style="font-size:54px">🚚📦</div>
  <h1>DISH Dock Academy</h1>
  <div data-i18n="certThis"></div>
  <div class="nm" id="cName"></div>
  <div><span data-i18n="certPassed"></span> <b id="cScore"></b></div>
  <p id="cDate"></p>
  <p style="margin-top:40px" data-i18n="certSign"></p>
</div>

<footer><span data-i18n="footer"></span> <span id="ver"></span></footer>

<script>
const VERSION = 'v1.2 · Oct 14, 2026';
const PASS = 40, TOTAL = 50, PER_Q = 2, CRIT_MIN = 8;
const DRAW = {critical:10, necessary:10, basic:5};   // cards drawn per attempt from the pool

// ===== UI text =====
const T = {
  en: {
    edition:"LPN Edition", langLabel:"Language",
    welcome:"Welcome to the dock 👷",

const TOPICS_ES = {"Receiving":"Recepción","LPN basics":"Básicos de LPN","Putaway":"Putaway (acomodo)","Replen":"Replen (reabasto)","Picking":"Surtido","Cycle count":"Conteo cíclico","Downstream":"Otros flujos","Nesting":"Anidado","Unpacking":"Desempacar","Labels":"Etiquetas","Corrections":"Correcciones","Lookups":"Consultas","Moves":"Movimientos"};

// a: true = the statement is RIGHT, false = WRONG
const Q = [
  // ---------- CRITICAL ----------

if (DETAILS.length !== Q.length) console.warn('DETAILS/Q length mismatch', DETAILS.length, Q.length);
Q.forEach((q,n)=>{ if(DETAILS[n]){ q.d=DETAILS[n][0]; q.ds=DETAILS[n][1]; } });
const dText = c => lang==='es' ? c.ds : c.d;



// ---------- helpers ----------
const $ = id => document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang = store.get('dishLpnLang')==='es' ? 'es' : 'en';
const L = () => T[lang];
const qText = c => lang==='es' ? c.qs : c.q;
const wText = c => lang==='es' ? c.ws : c.w;
const topic = c => lang==='es' ? (TOPICS_ES[c.k]||c.k) : c.k;
const tierLabel = t => L().tiers[t];
let deck=[], i=0, score=0, streak=0, answered=false, results=[], startedAt=0, inQuiz=false, lastFinish=null;
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); $('hud').style.display = id==='quiz' ? 'flex':'none'; window.scrollTo && window.scrollTo(0,0); };
const shuffle = a => { a=a.slice(); for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]];} return a; };
const lpn = n => (n%3===0?'LPN-PA':'LPN-BO') + (100+n);
const fullName = () => `${$('first').value.trim()} ${$('last').value.trim()}`;

// ---------- language ----------
function renderPrimer(){
  const P=PRIMER[lang]; $('primerTitle').textContent=P.title;
  $('primerList').innerHTML=P.steps.map(([h,b])=>`<li><b>${h}</b> - ${b}</li>`).join('');
  $('primerRule').textContent=P.rule;
}
function applyLang(){
  renderPrimer();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const v=L()[el.dataset.i18n]; if(typeof v==='string') el.textContent=v; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML=L()[el.dataset.i18nHtml]; });
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
  const best = store.get('dishLpnBest50'); $('best').textContent = best ? L().best(best) : '';
  if($('study').classList.contains('active')){ buildFilters(sHasMissed); sRender(); }
  if($('results').classList.contains('active') && lastFinish) renderResults();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store.set('dishLpnLang',lang); applyLang(); });

// ---------- quiz ----------
function startQuiz(){
  if(reviewLock){ startStudy(missCards()); return; }
  const f=$('first').value.trim(), l=$('last').value.trim();
  if(!f || !l){ show('start'); $('nameErr').style.display='block'; (f? $('last') : $('first')).focus(); return; }
  $('nameErr').style.display='none';
  deck = shuffle(['critical','necessary','basic'].flatMap(t=>shuffle(Q.filter(q=>q.t===t)).slice(0,DRAW[t]))); i=0; score=0; streak=0; results=[]; startedAt=Date.now(); inQuiz=true; lastFinish=null;
  show('quiz'); render();
}
function hud(){ $('hudQ').textContent = `📦 ${i+1}/${deck.length}`; $('hudScore').textContent = `⭐ ${score} / ${TOTAL}`; $('hudStreak').textContent = `🔥 ${streak}`; }
function render(){
  const c = deck[i]; answered=false;
  $('qCard').className='card '+c.t;
  $('qTier').className = 'tier '+c.t; $('qTier').textContent = tierLabel(c.t);
  $('qTopic').textContent = topic(c); $('qText').textContent = qText(c); $('qLabel').textContent = lpn(i+1);
  $('choices').style.display='grid'; $('nextRow').style.display='none';
  $('bRight').disabled=false; $('bWrong').disabled=false;
  hud();
  const pct = i/deck.length*100; $('fill').style.width = pct+'%'; $('rig').style.left = `calc(${pct*0.85}% + 6px)`;
}
function answer(choice){
  if(answered || !inQuiz) return; answered=true;
  $('bRight').disabled=true; $('bWrong').disabled=true;
  const c = deck[i], ok = choice===c.a;
  if(ok){ score += PER_Q; streak++; } else streak=0;
  results.push({c, ok, choice});
  $('qVerdict').className = 'verdict '+(ok?'ok':'no');
  $('qVerdict').textContent = ok ? (streak>=5 ? L().streak(streak) : L().correct) : L().notQuite;
  $('qAnswer').textContent = c.a ? L().itsRight : L().itsWrong;
  $('qWhy').textContent = wText(c);
  $('qCard').classList.add('flipped');
  $('choices').style.display='none'; $('nextRow').style.display='flex';
  $('bNext').textContent = i===deck.length-1 ? L().finishShift : L().nextPallet;
  hud();
}
function next(){ if(!answered) return; i++; if(i>=deck.length) finish(); else render(); }

function finish(){
  inQuiz=false; show('results');
  const critOk = results.filter(r=>r.ok && r.c.t==='critical').length;
  const pass = score>=PASS && critOk>=CRIT_MIN;
  const prev = +store.get('dishLpnBest50')||0; if(score>prev) store.set('dishLpnBest50', score);
  const secs = ['critical','necessary','basic'].map(t=>{ const all=results.filter(r=>r.c.t===t); return {t, ok:all.filter(r=>r.ok).length, n:all.length}; });
  const misses = results.filter(r=>!r.ok).sort((a,b)=>(a.c.t==='critical'?0:1)-(b.c.t==='critical'?0:1));
  lastFinish = {pass, secs, misses, critOk, date:new Date()};
  reviewLock = !pass && misses.length>0; reviewed = new Set(); justUnlocked=false;
  renderResults();
  if(pass) confetti();
}
function renderResults(){
  const {pass, secs, misses, critOk, date} = lastFinish;
  $('rTitle').textContent = pass ? L().passTitle : L().failTitle;
  $('rScore').innerHTML = `<span class="${pass?'pass':'fail'}">${score}</span><span class="muted" style="font-size:28px"> / ${TOTAL}</span>`;
  $('rBar').style.width = (score/TOTAL*100)+'%'; $('rBar').style.background = pass ? 'var(--green)':'var(--red)';
  const missedCrit = misses.filter(r=>r.c.t==='critical').length;
  $('rMsg').textContent = pass ? (missedCrit ? L().passMsgMiss(PASS, missedCrit) : L().passMsgClean(PASS)) : (score>=PASS ? L().failCrit(critOk) : L().failMsg(PASS, PASS-score));
  $('rTable').innerHTML = secs.map(x=>`<tr><td><span class="tier ${x.t}">${tierLabel(x.t)}</span></td><td>${x.ok} / ${x.n}</td></tr>`).join('');
  $('rMissTitle').textContent = misses.length ? L().reviewN(misses.length) : L().reviewNone;
  const esc = s => s.replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  $('rMiss').innerHTML = misses.map(r=>`<div class="miss"><span class="tier ${r.c.t}">${tierLabel(r.c.t)}</span> <span class="topic">${esc(topic(r.c))}</span><div style="margin:6px 0">"${esc(qText(r.c))}"</div><b>${r.c.a?L().itsRight:L().itsWrong}</b> ${esc(wText(r.c))}${dText(r.c)?`<div class="ctx"><span class="lbl">${PRIMER[lang].detLabel}</span>${esc(dText(r.c))}</div>`:''}</div>`).join('');
  $('rStudyMiss').style.display = misses.length ? 'inline-block':'none';
  $('rCert').style.display = pass ? 'inline-block':'none';
  lockUI();
  $('cName').textContent = fullName();
  $('cScore').textContent = `${score} / ${TOTAL}`;
  $('cDate').textContent = date.toLocaleDateString(L().locale,{year:'numeric',month:'long',day:'numeric'});
}

// ---------- retake lock (fail -> review misses first) ----------
let reviewLock=false, reviewed=new Set(), justUnlocked=false;
const missCards = () => results.filter(r=>!r.ok).map(r=>r.c);
function lockUI(){
  $('rRetry').disabled = reviewLock; $('rRetry').textContent = reviewLock ? L().lockBtn : L().retry;
  $('rLock').style.display = reviewLock ? 'inline-block':'none'; $('rLock').textContent = L().lockMsg;
  $('studyToQuiz').disabled = reviewLock;
  const showProg = sFilter==='missed' && (reviewLock || justUnlocked);
  $('sProg').style.display = showProg ? 'inline-block':'none';
  $('sProg').textContent = reviewLock ? L().reviewProg(reviewed.size, missCards().length) : L().unlocked;
}
function markReviewed(c){
  if(!reviewLock || sFilter!=='missed') return;
  reviewed.add(c.q);
  if(missCards().every(m=>reviewed.has(m.q))){ reviewLock=false; justUnlocked=true; }
  lockUI();
}

// ---------- study ----------
let sDeck=[], si=0, sFilter='all', sHasMissed=false;
function startStudy(cards){
  sHasMissed = !!(cards && cards.length);
  sDeck = sHasMissed ? cards : Q.slice(); si=0; sFilter = sHasMissed ? 'missed' : 'all';
  $('primer').open = !sHasMissed;
  buildFilters(sHasMissed); show('study'); sRender();
}
function buildFilters(hasMissed){
  const opts = [['all',L().fAll],['critical',L().tiers.critical],['necessary',L().tiers.necessary],['basic',L().tiers.basic]];
  if(hasMissed) opts.unshift(['missed',L().fMiss]);
  $('filters').innerHTML = opts.map(([k,l])=>`<button data-f="${k}" class="${k===sFilter?'on':''}">${l}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sFilter=b.dataset.f;
    sDeck = sFilter==='all' ? Q.slice() : sFilter==='missed' ? results.filter(r=>!r.ok).map(r=>r.c) : Q.filter(q=>q.t===sFilter);
    if(!sDeck.length) sDeck=Q.slice(); si=0; buildFilters(hasMissed); sRender();
  });
}
function sRender(){
  const c = sDeck[si]; $('sCard').className='card '+c.t;
  $('sTier').className='tier '+c.t; $('sTier').textContent=tierLabel(c.t); $('sTopic').textContent=topic(c);
  $('sQ').textContent=qText(c); $('sLabel').textContent=lpn(si+1);
  $('sAns').className='verdict '+(c.a?'ok':'no'); $('sAns').textContent = c.a ? L().ansRight : L().ansWrong;
  $('sWhy').textContent=wText(c);
  const P=PRIMER[lang]; $('sCtx').innerHTML = dText(c) ? `<span class="lbl">${P.detLabel}</span>${dText(c)}` : ''; $('sFlip').textContent = P.flipHint; $('sCount').textContent=`${si+1} / ${sDeck.length}`; lockUI();
}

// ---------- confetti ----------
function confetti(){
  const cv=$('confetti'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const icons=['📦','🚚','✅','⭐','🎉'], ps=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height,v:2+Math.random()*4,r:Math.random()*6,e:icons[Math.floor(Math.random()*icons.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,cv.width,cv.height); x.font='24px serif';
    ps.forEach(p=>{p.y+=p.v; p.x+=Math.sin((p.y+p.r)/30); x.fillText(p.e,p.x,p.y);}); if(++t<260) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height); })();
}

// ---------- wiring ----------
$('goQuiz').onclick=startQuiz; $('studyToQuiz').onclick=startQuiz; $('rRetry').onclick=startQuiz;
$('goStudy').onclick=()=>startStudy(); $('studyHome').onclick=()=>show('start');
$('rStudyMiss').onclick=()=>startStudy(results.filter(r=>!r.ok).map(r=>r.c));
$('rCert').onclick=()=>window.print();
$('bRight').onclick=()=>answer(true); $('bWrong').onclick=()=>answer(false); $('bNext').onclick=next;
$('sCard').onclick=()=>{ $('sCard').classList.toggle('flipped'); if($('sCard').classList.contains('flipped')) markReviewed(sDeck[si]); };
$('sNext').onclick=()=>{si=(si+1)%sDeck.length; sRender();}; $('sPrev').onclick=()=>{si=(si-1+sDeck.length)%sDeck.length; sRender();};
['first','last'].forEach(id=>$(id).addEventListener('input',()=>{ if($('first').value.trim()&&$('last').value.trim()) $('nameErr').style.display='none'; }));
document.addEventListener('keydown',e=>{
  if(!$('quiz').classList.contains('active')) return;
  const k=e.key.toLowerCase(); if(k==='r') answer(true); else if(k==='w') answer(false); else if(k==='enter') next();
});
window.addEventListener('beforeunload',e=>{ if(inQuiz){ e.preventDefault(); e.returnValue=L().leave; } });
applyLang();
$('ver').textContent = '· ' + VERSION;

</script>
